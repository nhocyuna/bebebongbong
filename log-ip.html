<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory+ · Nhật ký truy cập</title><style>body{margin:0;padding:32px;background:#f5f1f8;color:#25264a;font:15px system-ui}main{max-width:1200px;margin:auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 12px 35px #54406b22}h1{margin-top:0}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#f1eafa}button{padding:9px 14px;border:0;border-radius:99px;background:#725cff;color:white;cursor:pointer}</style></head><body><main><h1>Nhật ký truy cập Memory+</h1><p>Dữ liệu được lưu cục bộ trên thiết bị này để xem lại phiên truy cập.</p><button id="clear">Xóa nhật ký</button><table><thead><tr><th>Thời gian</th><th>IP</th><th>Vị trí dự đoán</th><th>Thiết bị / ứng dụng</th></tr></thead><tbody id="rows"></tbody></table></main><script>const key="memoryPlusVisitLog",rows=document.getElementById("rows");function render(){const a=JSON.parse(localStorage.getItem(key)||"[]").reverse();rows.innerHTML=a.map(x=>`<tr><td>${new Date(x.time).toLocaleString("vi-VN")}</td><td>${x.ip||"—"}</td><td>${[x.city,x.region,x.country].filter(Boolean).join(", ")||"—"}${x.lat!=null?`<br><small>${x.lat}, ${x.lon}</small>`:""}</td><td>${x.device||"—"}</td></tr>`).join("")||'<tr><td colspan="4">Chưa có dữ liệu.</td></tr>'}document.getElementById("clear").onclick=()=>{localStorage.removeItem(key);render()};render();</script></body></html>
