<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị · Những mảnh ký ức</title><style>body{font:14px Arial,sans-serif;background:#101820;color:#eee;margin:0}main{max-width:1050px;margin:auto;padding:25px}h1{font:42px Georgia,serif;color:#ebc49e}section{background:#26333d;padding:22px;border-radius:12px;margin:18px 0}input,button{font:inherit;padding:10px;border-radius:7px}input{background:#101820;border:1px solid #9a8b7c;color:white;min-width:260px}button{border:0;background:#d0a37d;cursor:pointer}button:hover{background:#efc39b}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #ffffff24;padding:8px;text-align:left}#logs{max-height:56vh;overflow:auto}a{color:#e5b98c}</style></head><body><main><a href="/">← Về câu chuyện</a><h1>Quản trị ký ức</h1><section><label for="adminKey">Mật khẩu admin</label> <input id="adminKey" type="password" autocomplete="off"> <button id="connect">Xem nhật ký</button><p id="message"></p></section><section id="controls" hidden><h2>Reset toàn bộ ảnh đã khóa</h2><p>Đưa tất cả ảnh đã xem trở lại vùng chọn và đặt lại 300 lượt. Tệp mã hóa vẫn giữ nguyên.</p><button id="reset">Reset trò chơi</button></section><section id="logSection" hidden><h2>Địa chỉ đã truy cập và thao tác gần đây</h2><div id="logs"><table><thead><tr><th>Thời gian</th><th>Địa chỉ IP</th><th>Thao tác</th><th>Đường dẫn</th><th>Kết quả</th></tr></thead><tbody id="logRows"></tbody></table></div></section></main><script src="/admin.js"></script></body></html>
